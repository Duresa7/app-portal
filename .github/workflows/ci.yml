name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  client:
    name: Publish Windows client
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        id: version
        run: |
          # A release build carries the tag's version so the updater can compare it with what is installed.
          # Any other build keeps the version in Directory.Build.props.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish self-contained win-x64
        run: |
          dotnet publish src/AppPortal.Client  -c Release -r win-x64 --self-contained ${{ steps.version.outputs.args }} -o out/client
          dotnet publish src/AppPortal.Updater -c Release -r win-x64 --self-contained ${{ steps.version.outputs.args }} -o out/updater
          mkdir -p out/package/client
          cp -r out/client/. out/package/client/
          # The updater is one self-contained file that sits beside the client and replaces it.
          cp out/updater/AppPortal.Updater.exe out/package/client/
          # The scripts ride inside client/ too, so an update keeps the uninstall entry's target present.
          cp deploy/windows/Install-AppPortalClient.ps1 deploy/windows/Uninstall-AppPortalClient.ps1 out/package/
          cp deploy/windows/Uninstall-AppPortalClient.ps1 out/package/client/
          cd out/package && zip -qr ../AppPortal-client-win-x64.zip .
          cd .. && sha256sum AppPortal-client-win-x64.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AppPortal-client-win-x64
          path: |
            out/AppPortal-client-win-x64.zip
            out/SHA256SUMS
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/AppPortal-client-win-x64.zip
            out/SHA256SUMS
          generate_release_notes: true

  server-image:
    name: Build server image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build (not pushed)
        run: docker build -f deploy/Dockerfile -t app-portal-server:ci .
