name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  client:
    name: Publish Windows client
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained win-x64
        run: |
          dotnet publish src/AppPortal.Client -c Release -r win-x64 --self-contained -o out/client
          mkdir -p out/package/client
          cp -r out/client/. out/package/client/
          cp deploy/windows/Install-AppPortalClient.ps1 deploy/windows/Uninstall-AppPortalClient.ps1 out/package/
          cd out/package && zip -qr ../AppPortal-client-win-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AppPortal-client-win-x64
          path: out/AppPortal-client-win-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/AppPortal-client-win-x64.zip
          generate_release_notes: true

  server-image:
    name: Build server image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build (not pushed)
        run: docker build -f deploy/Dockerfile -t app-portal-server:ci .
