name: CI

# Two shapes of run. Day to day, on a pull request or a push to main: format check, build, tests and
# the server image, all on Linux. Before a release, on a v* tag or when somebody asks for it from the
# Actions tab: the same plus everything on Windows, which is the installer and the test matrix's
# second leg. A v* tag then runs the release job, the only place a GitHub release or a
# registry image is created, and only after all of it passed.
#
# The Windows jobs are the slow part of this workflow. They are the jobs that must pass before
# anything ships, not the jobs that must pass before every commit. Run the full gate from the Actions
# tab in the days before a release, and treat a red result there as blocking the tag. This repository
# is public, so standard GitHub-hosted runners are free: the gate saves waiting, not money.
#
# The Windows release files are built once, by build-windows, always on a GitHub-hosted runner, and
# installer-verify installs and tests exactly those files wherever WINDOWS_RUNNER sends it. The release
# job publishes the same artifacts, so what reaches devices is byte for byte what was tested.
#
# Signing through SignPath Foundation is switched on by the SIGNPATH_ORGANIZATION_ID repository
# variable and needs the SIGNPATH_API_TOKEN secret. The gate turns that into one of three modes: release
# on a v* tag, test on a dispatch of main with "sign" ticked, and off everywhere else, including every
# pull request and fork. With it off, the release is built exactly as before, unsigned.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Run the Windows jobs as well
        type: boolean
        default: true
      sign:
        description: Test-sign the Windows build through SignPath (main only, when SignPath is set up)
        type: boolean
        default: true

# A second push to the same branch makes the first run's remaining minutes worthless. The event is part
# of the group because a pre-release run is started by hand on main and takes half an hour of Windows
# time; a one-line docs push to main must not be able to throw that away.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  IMAGE: ghcr.io/duresa7/app-portal-server

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the version and check the tag against it
        id: read
        run: |
          # Directory.Build.props is the one source of the version. A release tag must name the same
          # version, and must point at a commit that is on main, so a release is always a build of main.
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ -z "$version" ]]; then
            echo "::error::No <Version> in Directory.Build.props"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in Directory.Build.props: $version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Tag v$tag does not match Directory.Build.props version $version. Bump the props file, commit, then tag that commit."; exit 1
            fi
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag v$tag points at $GITHUB_SHA, which is not on main."; exit 1
            fi
            echo "Tag v$tag matches and is on main."
          fi

  # Every job below that costs Windows minutes reads this.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.decide.outputs.windows }}
      signing: ${{ steps.decide.outputs.signing }}
    steps:
      - id: decide
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          # Secrets cannot appear in an if:, so only whether it exists is passed, never its value.
          HAS_SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGN_INPUT: ${{ inputs.sign }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            windows="${{ inputs.windows }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            windows=true
          else
            windows=false
          fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

          # Only a push or a dispatch can sign, so no pull request ever reaches SignPath, and a fork
          # fails the repository test even if it copies the variable.
          signing=off
          if [ "$windows" = true ] && [ "$GITHUB_REPOSITORY" = Duresa7/app-portal ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              signing=release
            elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$SIGN_INPUT" = true ]; then
              signing=test
            fi
            if [ "$signing" != off ] && [ "$HAS_SIGNPATH_TOKEN" != true ]; then
              echo "::error::SIGNPATH_ORGANIZATION_ID is set but the SIGNPATH_API_TOKEN secret is not. Add the secret, or delete the variable to build unsigned."
              exit 1
            fi
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "Signing: $signing"

  test:
    name: Test (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.windows == 'true' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  build-windows:
    name: Build the Windows release files
    needs: [gate, version]
    if: needs.gate.outputs.windows == 'true'
    # GitHub-hosted whatever WINDOWS_RUNNER says. SignPath signs only what a GitHub-hosted runner built
    # from this repository, and building here in every run means the files installer-verify tests are
    # the files the release publishes, signed or not.
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read        # lets SignPath fetch the artifacts it signs, through github.token
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING: ${{ needs.gate.outputs.signing || 'off' }}
      SIGNPATH_POLICY: ${{ needs.gate.outputs.signing == 'release' && 'release-signing' || 'test-signing' }}
    # Each stage embeds the one before it, so signing follows the build: the payload before WiX
    # harvests it, the MSI after Protect-EnrollmentLogging.ps1 and before the bootstrapper carries it,
    # and the bootstrapper last. Each signing stage uploads, submits, then puts the signed files back
    # and checks them. A release request waits for a person to approve it, hence the hour.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish the MSI payloads
        shell: pwsh
        run: |
          dotnet publish src/AppPortal.Client -c Release -r win-x64 --self-contained -o out/client
          if ($LASTEXITCODE -ne 0) { throw 'Client publish failed.' }
          dotnet publish src/AppPortal.Agent -c Release -r win-x64 --self-contained -o out/agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent publish failed.' }
      - name: Hand the payloads to SignPath
        id: payloads
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        uses: actions/upload-artifact@v7
        with:
          # Zipped and rooted at out/, which is what .signpath/artifact-configurations/payloads.xml expects.
          name: unsigned-payloads
          path: |
            out/client/AppPortal*.exe
            out/client/AppPortal*.dll
            out/agent/AppPortal.Agent.exe
          retention-days: 1
          if-no-files-found: error
      - name: Sign the payloads
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'app-portal' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: payloads
          github-artifact-id: ${{ steps.payloads.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/payloads
      - name: Put the signed payloads back and check them
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        shell: pwsh
        run: |
          Copy-Item signed/payloads/client/* out/client -Force
          Copy-Item signed/payloads/agent/AppPortal.Agent.exe out/agent -Force
          ./deploy/windows/Test-Signatures.ps1 -Mode $env:SIGNING -Path out/client, out/agent
      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet build src/AppPortal.Installer/AppPortal.Installer.wixproj -c Release -o out/installer
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed.' }
      - name: Hand the MSI to SignPath
        id: msi
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-msi
          path: out/installer/AppPortal-${{ env.VERSION }}-x64.msi
          retention-days: 1
          if-no-files-found: error
      - name: Sign the MSI
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'app-portal' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/msi
      - name: Put the signed MSI back and check it
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        shell: pwsh
        run: |
          # Nothing opens the MSI for writing after this; the bootstrapper embeds it unchanged.
          Copy-Item "signed/msi/AppPortal-$env:VERSION-x64.msi" out/installer -Force
          ./deploy/windows/Test-Signatures.ps1 -Mode $env:SIGNING -Path "out/installer/AppPortal-$env:VERSION-x64.msi"
      - name: Build the bootstrapper around the MSI
        shell: pwsh
        run: |
          # The bootstrapper carries the MSI as a resource, so it can only be built after it.
          if (-not (Test-Path src/AppPortal.Setup)) {
            'No bootstrapper project in this commit; the installer checks run against the MSI alone.'
            exit 0
          }
          $msi = (Resolve-Path "out/installer/AppPortal-$env:VERSION-x64.msi").Path
          dotnet publish src/AppPortal.Setup -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:AppPortalMsiPath="$msi" -o out/setup
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrapper publish failed.' }
          if (-not (Test-Path out/setup/AppPortalSetup.exe)) { throw 'No AppPortalSetup.exe was produced.' }
      - name: Hand the bootstrapper to SignPath
        id: setup
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: out/setup/AppPortalSetup.exe
          retention-days: 1
          if-no-files-found: error
      - name: Sign the bootstrapper
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'app-portal' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/setup
      - name: Put the signed bootstrapper back and check it
        if: env.SIGNING == 'test' || env.SIGNING == 'release'
        shell: pwsh
        run: |
          Copy-Item signed/setup/AppPortalSetup.exe out/setup -Force
          ./deploy/windows/Test-Signatures.ps1 -Mode $env:SIGNING -Path out/setup/AppPortalSetup.exe
      - name: Check every file the release carries
        shell: pwsh
        run: |
          # With signing off this only reports. With it on, a file SignPath skipped fails here by name.
          ./deploy/windows/Test-Signatures.ps1 -Mode $env:SIGNING `
            -Path out/client, out/agent, "out/installer/AppPortal-$env:VERSION-x64.msi", out/setup/AppPortalSetup.exe
      - name: The release feed still parses
        shell: pwsh
        env:
          # A device asks anonymously. This runner shares its address with every other runner on it, so
          # the anonymous allowance is long spent and GitHub answers 403 instead of the feed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Every installed agent reads this feed to find its next version. A change in GitHub's answer
          # should fail a build here, not stop a fleet updating. It downloads nothing. The last line
          # says which signature rule the agent applies to updates: a release-signed agent that did not
          # know it was signed would take an update from anybody.
          $output = ./out/agent/AppPortal.Agent.exe --check
          $code = $LASTEXITCODE
          $output
          if ($code -ne 0) { throw 'The agent could not read the release feed.' }
          if ($env:SIGNING -eq 'release' -and -not ($output -match 'signed by SignPath Foundation')) {
            throw 'The release-signed agent does not read its own signature as SignPath Foundation.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: AppPortal-msi
          path: out/installer/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: hashFiles('out/setup/AppPortalSetup.exe') != ''
        with:
          name: AppPortal-setup
          path: out/setup/AppPortalSetup.exe
          if-no-files-found: error

  installer-verify:
    name: Install and verify on Windows
    needs: [gate, version, build-windows]
    if: needs.gate.outputs.windows == 'true'
    # windows-latest unless the WINDOWS_RUNNER repository variable names a self-hosted runner. It may
    # run anywhere because it builds nothing that ships: it installs the files build-windows made.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING: ${{ needs.gate.outputs.signing || 'off' }}
    steps:
      # The checkout carries the scripts, and ci-installer-test.ps1 builds the server it installs against.
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: AppPortal-msi
          path: out/installer
      - uses: actions/download-artifact@v8
        with:
          name: AppPortal-setup
          path: out/setup
      - name: Leave nothing of an earlier run in place
        shell: pwsh
        run: |
          # Both checks below assume no App Portal is installed and no %ProgramData%\AppPortal exists.
          # A GitHub-hosted runner guarantees that by being thrown away; a self-hosted one does not, and
          # the leftovers make Verify-Msi.ps1 report that REMOVEDATA=1 leaked data that was never its.
          ./deploy/windows/Reset-AppPortal.ps1
      - name: Check the package on its own
        shell: pwsh
        run: |
          ./src/AppPortal.Installer/Verify-Msi.ps1 -Path "out/installer/AppPortal-$env:VERSION-x64.msi" -Version "$env:VERSION"
      - name: Fetch the previous release for the upgrade check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # There is nothing to upgrade from until a release exists, and a fork has none at all, so a
          # failure here is not a reason to fail the gate.
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern '*-x64.msi' --dir previous
          if ($LASTEXITCODE -ne 0) { 'No previous release MSI; the upgrade check will be skipped.' }
      - name: Signing never goes backwards
        shell: pwsh
        run: |
          # A signed agent installs only updates signed by the same publisher. Once a release is signed,
          # an unsigned one after it strands every PC that took the signed one.
          $previous = Get-ChildItem previous/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($previous) {
              $signature = Get-AuthenticodeSignature $previous.FullName
              $wasSigned = $signature.Status -eq 'Valid' -and
                  $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -eq 'SignPath Foundation'
              if ($wasSigned -and $env:SIGNING -ne 'release') {
                  $text = "$($previous.Name) is signed and this build is not. Every agent that release installed refuses an unsigned update. Restore the SignPath variable and secret."
                  if ($env:GITHUB_REF -like 'refs/tags/v*') { throw $text } else { "::warning::$text" }
              }
          }
      - name: Install, enroll, use and remove
        shell: pwsh
        run: |
          $arguments = @{
            Msi     = "out/installer/AppPortal-$env:VERSION-x64.msi"
            Version = $env:VERSION
            Signing = $env:SIGNING
          }
          if (Test-Path out/setup/AppPortalSetup.exe) { $arguments.Setup = 'out/setup/AppPortalSetup.exe' }
          $previous = Get-ChildItem previous/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($previous) { $arguments.PreviousMsi = $previous.FullName }
          ./deploy/windows/ci-installer-test.ps1 @arguments
      - name: Keep the logs of a failed install
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: installer-verify-logs
          path: ${{ runner.temp }}/app-portal-installer-test
          if-no-files-found: ignore

  server:
    name: Build and smoke test server image
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f deploy/Dockerfile -t "$IMAGE:ci" .
      - name: Start in fake Action1 mode and exercise it
        run: deploy/smoke-test.sh "$IMAGE:ci"
      - name: Save the tested image for the release job
        run: docker save "$IMAGE:ci" | gzip > server-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: server-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [version, gate, test, build-windows, installer-verify, server]
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AppPortal-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: server-image
          path: image
      - name: Push the tested server image
        run: |
          docker load < image/server-image.tar.gz
          docker tag "$IMAGE:ci" "$IMAGE:$VERSION"
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
      - name: Checksum everything the release carries
        run: |
          # Every installed agent verifies the MSI it downloads against this file, so a release without
          # it is a release no device can take.
          cd out
          sha256sum "AppPortal-$VERSION-x64.msi" AppPortalSetup.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        # Last on purpose: every installed client polls the latest release, so this is the moment
        # the build reaches devices.
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/AppPortal-*-x64.msi
            out/AppPortalSetup.exe
            out/SHA256SUMS
          body: "Run AppPortalSetup.exe on one PC, or deploy the MSI with SERVERURL and ENROLLMENTKEY for a fleet. The client zip is retired: move a PC installed from one by deploying this MSI to it once.${{ needs.gate.outputs.signing == 'release' && ' The MSI, AppPortalSetup.exe and the App Portal executables are signed by SignPath Foundation; the README says how to check.' || '' }}"
          fail_on_unmatched_files: true
          generate_release_notes: true
