# App Portal server. Build from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
#
# Two files sit beside this one, both gitignored:
#   server.env  container environment, including the Action1 API credential. Render it from
#               1Password references: op inject -i deploy/server.env.example -o deploy/server.env
#   .env        compose variable interpolation, read only by compose itself. It sets
#               APP_PORTAL_BIND, for example APP_PORTAL_BIND=192.168.40.35:3004. Compose does not
#               interpolate from env_file, so the bind address cannot live in server.env.
services:
  app-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: app-portal-server:local
    container_name: app-portal
    restart: unless-stopped
    env_file:
      - server.env
    ports:
      # APP_PORTAL_BIND pins the listener to one interface, for example 192.168.40.35:3004
      - "${APP_PORTAL_BIND:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - app-portal-data:/app/data

volumes:
  app-portal-data:
